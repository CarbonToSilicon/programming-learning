<!DOCTYPE html>
<html>
  <head>
    <title>
      selectors
    </title>
    <link rel="stylesheet" href="selectors.css" type="text/css">
  </head>
  <body>
    <element>
      <p>* ,selector</p>
      <span>* ,selector</span>
      <div>* ,selector</div>
    </element>
    <h1 class="name0"> name0 ,SELECTOR</h1>
    <h1 class="name1 name2"> .name1 name2 ,selector</h1>
    <h1 id="id1"> #id1 ,selector</h1>
    <h1 class="class02"> h1.class02 ,selector </h1>
    <span>
      <p>span p ,selector</p>
      span p ,not selected
    </span>
    <div><p>div > p ,1</p><p>div > p ,2</p></div>
    <div><p>div > p ,3</p></div>
    <div><section><p>div + p , not selected</p></section></div>
    <p>div + p ,selector</p>
    <a href="one">[target]</a>
    
  </body>
</html>
