<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scalable Vector Graphics</title>
  <style type="text/css">
    svg.svg1 {
      width: 100vw;
      height: 350px;
      background-color: #f0f0f0;
    }
    
    rect.rect1 {
      fill: #23e4f3;
      stroke: mediumvioletred;
      stroke-width: 2px;
    }
    
    circle.circle1 {
      fill: #925341;
    }
    
    rect.rect2 {
      fill: navajowhite;
    }

    rect.rect3 {
      fill: #f333f3;
      stroke: red;
      stroke-width: 50px;
    }

    svg.svg2 {
      width: 100vw;
      height: 300px;
      background-color: #fff0af;
    }
  </style>
</head>
<body>

  <svg class="svg1">
    <rect width="50" height="150" fill="#22e522"/>
    <rect class="rect1" x="100" y="50" width="400" height="200"/>
    <circle class="circle1" cx="100" cy="50" r="25"/>
    <circle class="circle2" cx="300" cy="150" r="100" fill="#f34573"/>
    <rect class="rect2" x="600" y="75" width="300" height="150" stroke="#534223" stroke-width="4px" rx="150" ry="150"/>
    <rect class="rect3" x="650" y="100" width="200" height="150" opacity="0.9" stroke-opacity="0.2"/>
  </svg>

  <svg class="svg2">
    <ellipse class="ellipse1" cx="150" cy="150" rx="100" ry="40" fill="teal" transform="rotate(20, 200, 200)"/>
  </svg>

</body>
</html>
