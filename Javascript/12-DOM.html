<body>
    <button id="id001" class="btn btn1"> click here </button>
    <button id="id002" class="btn btn2"> click here </button>
    
    <h1> go to work</h1>
    <h1> it is a para</h1>

    <h4>
      <ul>

        <li> text2 </li>

    <script>
      /*
        window - *parent of document node
          |
       document -*a Node
          |
         html - *child-Node of document node
          | 
 -------------------
 |                 |
<head>- siblings -<body> - *descendants of document 
 |                 |     |
 |-- <meta>        |-- <div>
 |-- <meta>        |     |
 |-- <title        |     |-- <img>
 |-- <link>        |     |-- <h1>
 |-- <style>       |     |-- <p>
 |-- etc.          |
                   |-- <script>
      */

      // every element inside an object is called "node"


      /*

      console.log(window);
      window.alert('go to your home...');
      window.console.log('helol/');

      // the "document" object is an child object of "window" object. It represets the html page itself like body, head, url, title, cookie etc.

      */

      /*

      console.dir(document);
      console.dir(window);
      */

      /////////////////////////////////////////////////////////
      /*
          // document is an object in js and body is its property

          // replaces all elements within the body tag with the code written in the innerHTML property

          // replaces document title with the text value inside title property
      document.title = "don't know";
      console.log(document.title)
      */

      /* 
      console.log(document.querySelector('button'))

          // selects the text inside the selected element

      */

      //////////////////////////////////////////////////////      

      // *** always write <script> in the end just before ending </body

      /*
      // selcting body elments using dom
      let test = document.getElementById("id001");
      console.log(test);
      console.dir(document.getElementById("id001"));
      console.log(document.getElementsByClassName("btn"));
      console.log(document.getElementsByTagName("h1"));

      console.log(document.querySelector("h1")); // returns first element
      console.log(document.querySelector("#id002"));
      console.log(document.querySelector(".btn"));

      console.log(document.querySelectorAll('.btn')) // returns a Nodelist
      */

      // document properties
        // .tagName
      console.log(document.querySelector("button").tagName);
      console.log(document.querySelector("h1").tagName);
        // .innerText
      console.log(document.querySelector("h4").firstChild);
      console.log(document.querySelector("h4").firstElementChild);
      console.log(document.querySelector("h4").lastChild);
      console.log(document.querySelector("h4").firstElementChild);
      console.log(document.querySelector("h4").children[0]);
      console.log(document.querySelector("h4").children[1]);
      
    </script>
