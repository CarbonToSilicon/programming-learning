<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS variable </title>
</head>
<body>
  <script>
    
    // variable cannot be re-declared but can be updated. A block scope variable.
    
    let variable1 = 3;
    console.log(variable1);

    const calc = 2 + 2;
    console.log(calc);
    console.log(calc + 2);

    const result = calc + 2;
    console.log(result);

    const message = 'hello';
    console.log(message); console.log(';');

    variable1 = 5;
    console.log(variable1);

    variable1 = variable1 + 2;
    console.log(variable1);
    
    const eg = variable1;
    console.log(eg);

    // variable cannot be re-declared and updated. A block scope variable. More secure way.

    const centsIn$ = 100;
    console.log(centsIn$);

    // variable can be re-declared and updated. A globle scope variable. Old and no type safty.
    
    var variable2 = "globle not secure"
    console.log(variable2);
    var variable2 = "I am everywhere"
    console.log(variable2);

    // implied/implicit globle variable. Dangerous
    fake = "Bad, I am everywhere";
    
    // typeof keyword
    console.log(typeof fake);
  </script>
</body>
</html>
