<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo list app</title>
    <!-- <link rel="stylesheet" href="../css/15-todo-list.css" type="text/css"/> -->
    <style>
        html {
            margin: 0;
        }
        
        body {
            margin: 0;
            background: #bfeed8;
        }
        
        .container1 {
            margin: 0;
            border-radius: 0 0 2rem 2rem;
            display: flex;
            flex-direction: column;
            background: #9c72ff;
            height: 150px;
            /* width: 90vw; */
            align-items: center;
            justify-items: center;
        }

        .main-title {
            margin-bottom: 10px;
        }
        .group1 {
            align-items: center;
            justify-content: center;
        }
        
        .input1 {
            height: 23px;
            width: 340px;
            margin-left: 1em;
            border-radius: 10px;
            /*background: linear-gradient(#fcaad7, #fff);*/
            font-size: 16px;
        }
        
        .date1 {
            margin: 10px;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            
            /*background: linear-gradient(#fdaad7, #fff);*/
            
            padding-right: 0px;
            background-image: url('calendar.png');
            background-repeat: no-repeat;
            background-size: contain;
        }
        
        .btn1 {
            height: 24px;
            border-radius: 1em;
            background: #a8f794;
            border-color: #ffff;
            justify-sel: center;
        }
        .task-list {
            height: 35px;
            padding: 3px;
            /*background: #e7f37e;*/
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .task-box {
            background: #e3e8e0;
            border: 2.5px solid #70bfbf;
            border-radius: 10px;
            padding: 0px;
            width: 330px;
            height: 30px;
            margin-left: 10px;
            margin-left: 10px;
        }
        .tick-box {/* 1. Base Styles (Before Tick / Unchecked State) */
  
            /* Hides the default ugly browser checkbox */
            appearance: none;
            -webkit-appearance: none; /* For Safari compatibility */
            
            /* 2. Shape & Size */
            width: 24px;
            height: 24px;
            border-radius: 6px; /* Set to 50% for a perfect circle */
            
            /* 3. Border & Background Before Tick */
            border: 2px solid #6b7280; /* Gray border */
            background-color: #ffffff; /* White background */
            
            /* Layout alignments */
            display: inline-grid;
            place-content: center;
            cursor: pointer;
            vertical-align: middle;
            margin-left: 10px;
            
            /* Smooth animation transition when clicked */
            transition: all 0.2s ease-in-out;
        }
      
        /* 4. Hover State (Optional) */
        .tick-box:hover {
            border-color: #2563eb; /* Changes border to blue on hover */
            background-color: #eff6ff; /* Soft blue tint */
        }
      
        /* 5. After Tick Styles (Checked State) */
        .tick-box:checked {
            background-color: #2563eb; /* Solid Blue background */
            border-color: #2563eb;     /* Blue border to match */
        }
        
        /* 6. Creating the Checkmark (Tick) Symbol */
        .tick-box::before {
            content: "";
            width: 10px;
            height: 6px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(-45deg) translate(1px, -1px);
            
            /* Hide the tick by default */
            scale: 0; 
            transition: scale 0.15s ease-in-out;
        }
        
        /* 7. Showing the Checkmark when ticked */
        .tick-box:checked::before {
            scale: 1; /* Makes the tick appear with a zoom effect */
        }
      
        .task-remove {
            height: 26px;
            width: 26px;
            /*background: image('../../assets/remove-button.png');*/
            background-size: contain;
            background-repeat: no-repeat;
            /*background: image('remove-button.png');*/
            border: none;
            cursor: pointer;
            transition: filter 0.2s ease, transform 0.1s ease;
            border-radius: 100%;
            background-image: url('remove-button.png');
            
        }
        .task-remove:hover {
            /* Makes the image 30% brighter */
            filter: brightness(1.3);
        }
        .task-remove:active {
            /* Makes it slightly darker when pressed and shrinks it a tiny bit */
            filter: brightness(0.9);
            transform: scale(0.95);
        }
        .filtered-date {
            margin-top: 23px;
            margin-bottom: 8px;
            margin-left: 10px;
            color: #515d93;
        }
    </style>
</head>
<body>
    <section  class="form1 container1">
        <h1 class="main-title"> To-Do List </h1>
        <form>
            <form>
                <input class="group1 text1 input1" type="text" placeholder="Type a task">
                <input class="group1 date1" type="date" onchange="alert('Selected value: ' + this.value)">
            </form>
            <button class="group1 btn1" type="button" onclick="addTodo();"> ADD TO-DO </button>
        </form>
    </section>
    
    <!-- model1 -->
    <section class="container2">
        <div class="filtered-date">04/10/2027</div>
        <main class="task-list">
            <!-- <div class="task-remove"></div> -->
            <button class="task-remove"></button>
            <div class="task-box"></div>
            <input class="tick-box" type="checkbox">
        </main>
    </section>
    <!------------------------------------>
    <!-- <script src="15-todo-list.js"></script> -->
    <script>
        // const todolist = {};
        const todoTList = [];
        const todoDList = [];

        function addTodo() {
            let todoName = document.querySelector(".text1");
            let todoDate = document.querySelector('.date1');
            
            // 1. Validate if fields are filled out first
            if (todoName.value.trim() === "") {
                alert("Please type a task!");
                return;
            }
            if (todoDate.value === "") {
                alert("Please select a valid date!");
                return;
            }
            
            // 2. Safely push the values into your arrays
            todoTList.push(todoName.value);
            todoDList.push(todoDate.value);
            
            console.log("Tasks:", todoTList);
            console.log("Dates:", todoDList);

            // 3. Reset form inputs safely AFTER values are stored
            todoName.value = "";
            todoDate.value = "";
        }
    </script>
</body>
</html>
