<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Arrays and Loops </title>
</head>
<body>

    <script>
        let myArray = [22, 36, 60];
        console.log(myArray);
        console.log(myArray[0]);
        console.log(typeof myArray);
        console.log(Array.isArray(myArray));
        console.log(Array.isArray(['hey', 'hello', 'hi']));
        myArray[0] = 10;
        myArray[3] = 99;
        console.log(myArray);
        console.log(myArray.length);
        myArray.push(100);
        console.log(myArray);
        myArray.splice(0, 2);
        console.log(myArray);
    </script>
</body>
</html>
