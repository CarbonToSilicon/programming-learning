<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Rock Paper Scissors </title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap');
    body {
        margin: 0px;
        padding: 0px;
        background-image: 
            radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.5) 0%, transparent 40%),
            radial-gradient(circle at 80% 80%, hsla(330, 81%, 60%, 0.5) 0%, transparent 40%);            
        height: 200vh;
        background-repeat: no-repeat;
        
    }

    .rubik-glitch-regular {
        font-family: "Rubik Glitch", system-ui;
        font-weight: 400;
        font-style: normal;
        font-size: 7vh;
        margin: 5vw;
    }

    .play-container {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        height: fit-content;
        margin-right:6vw;
        margin-left: 6vw; 
    }

    /* .btn {
        background: transparent 100%;
        background-image: radial-gradient(circle at center, rgb(255, 208, 78) 0%, transparent 80%);
        height: 10rem;
        width: 10rem;
        border-radius: 50%;
        border: 0;
        margin-left: 2em;
        margin-right: 2em;
        font-size: 7rem;
    } */
    button {
        width: 25vw;
        height: 25vw;
        border-radius: 50%;
        font-size: 18vw;
        cursor: pointer;
        margin-left: 1vw;
        margin-right: 1vw;
        /* 1. Semi-transparent white fill */
        background: rgba(255, 255, 255, 0.25);
        
        /* 2. Blur the background elements behind the button */
        backdrop-filter: blur(12px);
        /* -webkit-backdrop-filter: blur(12px); */
        
        /* 3. High-contrast white border for realistic rim light */
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        
        /* 4. Multi-layered glass shadows */
        box-shadow: 
            0 8px 32px 0 rgba(31, 38, 135, 0.15), /* Outer drop shadow */
            inset 0 0 12px 0 rgba(255, 255, 255, 0.5); /* Inner edge glare */
            
        transition: all 0.3s ease;
    }

    button:hover {
        background: rgba(255, 255, 255, 0.4);
        border-color: rgba(255, 255, 255, 0.9);
        transform: translateY(-5px);
        box-shadow: 
            0 12px 40px 0 rgba(31, 38, 135, 0.25),
            inset 0 0 18px 0 rgba(255, 255, 255, 0.7);
    }

    .result-container {
        height: 35vw;
        border-radius: 3vw;
        margin: 7vh 13vw;
        display: grid;
        
        /* Allow children to fill the full height of their assigned grid area */
        align-items: stretch;
        justify-items: stretch;
        
        background: rgba(250, 203, 102, 0.37);
        grid-template-columns: repeat(7, 1fr);
        
        /* 2 rows: Top row for Title, bottom row for Scores & Line */
        grid-template-rows: repeat(4, 1fr); 
        grid-template-areas: 
            "a a a a a a a"
            "b b b c d d d"
            "e e e c f f f"
            "g g g c h h h";
        /* grid-gap: 1rem; */
    }

    /* Shared Flexbox layout for children to center text vertically & horizontally */
    .score {
        margin: 0.1rem;
        padding: 0px;
        /* background: radial-gradient(at top, rgb(255, 220, 177), #ffffff55); */
        text-align: center;
        /* text-decoration: wavy; */
        /* font-family:Verdana, Geneva, Tahoma, sans-serif; */
        /* border-radius: 6% 6% 6% 6%; */
        font-size: 3.5vw;
        justify-content: center;
        align-content: center;
        /* grid-gap: 20px; */
    }

    .title {
        grid-area: a;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        border-radius: 3vw 3vw 0 0;
    }

    .score1 {
        grid-area: b;
        /* justify-self: right; */
    }

    .line {
        grid-area: c;
        /* Keeps the middle line thinner than the score boxes */
        /* width: 30%; */
        justify-self: center;
        background: #000;
        width: 2px;
        height: 90%;
    }

    .score2 {
        grid-area: d;
        /* justify-self: left; */
        /* width: 135%; */
    }

    .headComputer {
        grid-area: e;
        color: hsla(330, 81%, 60%, 0.76);
    }

    .headUser {
        grid-area: f;
        color: rgba(99, 101, 241, 0.76);
    }

    #computerStep {
        grid-area: g;
        border-radius: 0 0 0 3vw;
    }

    #userStep {
        grid-area: h;
        border-radius: 0 0 3vw 0;
    }
  </style>
</head>
<body>
  <h2 class="rubik-glitch-regular"> Rock Paper Scissors </h2>

  <section class="result-container">
    <div class="score title">Score</div>
    <div class="score line"></div>
    <div class="score headComputer"> Computer </div>
    <div class="score headUser"> You </div>
    <div id="computerScore" class="score score1">0</div>
    <div id="userScore" class="score score2">0</div>
    <div id="computerStep" class="score"></div>
    <div id="userStep" class="score"></div>
  </section>

  <section class="play-container">
    <button class="btn btn1" onclick="playGame('Rock');">✊</button>
  
    <button class="btn btn2" onclick="playGame('Paper');">🖐️</button>

    <button class="btn btn3" onclick="playGame('Scissors');">✌️</button>
  </section>
  <script>
    let computerMove = '';
    let randomNum;
    let result = '';
    // let c_Score = '';
    const data = {
        cStep: "",
        uStep: "",
        cScore: 0,
        uScore: 0
    };

    function playGame(userMove) {
        randomNum = Math.random();
        if (randomNum > 0 && randomNum <= 0.33) {
            computerMove = 'Rock';
        } else if (randomNum > 0.33 && randomNum <= 0.66) {
            computerMove = 'Paper';
        } else {
            computerMove = 'Scissors';
        }
        console.log(computerMove);
        
        if (computerMove === userMove) {
            result = 'Tie 🤝';
        } else if (
            (computerMove === 'Rock' && userMove === 'Paper') ||
            (computerMove === 'Paper' && userMove == 'Scissors') ||
            (computerMove === 'Scissors' && userMove === 'Rock')
        ) {
            result = 'You win 🎉';
            data.uScore += 1;
        } else { 
            result = 'You lose 🙊 ';
            data.cScore += 1;
        } 
        // alert(`You picked ${userMove}.\n Computer picked ${computerMove}.\n ${result}`)
    
        data.cStep = computerMove;
        data.uStep = userMove;
        let com_displayScore = document.getElementById("computerScore");
        com_displayScore.textContent = data.cScore;

        
        let user_displayScore = document.getElementById("userScore");
        user_displayScore.textContent = data.uScore;

        let com_move = document.getElementById("computerStep");
        com_move.textContent = data.cStep;

        let u_move = document.getElementById("userStep");
        u_move.textContent = data.uStep;
    }
  </script>
</body>
</html>
