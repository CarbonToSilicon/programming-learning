<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call() methods</title>
</head>
<body>
    <script>
        const student = {
            printDetail: function (address) {
                console.log(this.st_name + ' ' + this.age + ' ' + address)
            }
        }
        const student_01 = {
            st_name: 'Ramesh',
            age: 17,
        }
        const student_02 = {
            st_name: 'Kajal',
            age: 19,
        }
        const student_03 = {
            st_name: 'Lokesh',
            age: 17,
        }
        
        student.printDetail.call(student_01,'Kankroli');
        student.printDetail.call(student_02,'Jaipur');
        student.printDetail.call(student_03,'Udaipur');


    </script>
</body>
</html>
