<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call() methods</title>
</head>
<body>
    <script>
        // this in method
        const student = {
            printDetail: function (greet, address) {
                console.log(`${greet} ${this.st_name}, you are ${this.age} and live in ${address}`)
            }
        }
        const student_01 = {
            st_name: 'Ramesh',
            age: 17,
        }
        const student_02 = {
            st_name: 'Kajal',
            age: 19,
        }
        const student_03 = {
            st_name: 'Lokesh',
            age: 17,
        }
        
        // call() just to use a method from an object multiple times on other objects out side of the method object
        student.printDetail.call(student_01, 'Hello', 'New Delhi');
        student.printDetail.call(student_02, 'Hey', 'Jaipur');
        student.printDetail.call(student_03, 'Hello', 'Chandigarh');
        console.log('');

        // apply() when data is organized in array format
        student.printDetail.apply(student_01, ['Hello', 'Ahamdabad']);
        student.printDetail.apply(student_02, ['Hi', 'Jaisalmer']);
        student.printDetail.apply(student_03, ['Hey', 'Jodhpur']);
        console.log('');

        // bind() to save memory for some time and later use
        const first = student.printDetail.bind(student_01, 'Hello', 'Raipur');
        const second = student.printDetail.bind(student_02, 'Hey', 'Ajmer');
        const third = student.printDetail.bind(student_03, 'Hi', 'Dudu');
        third();
        second();
        first();
    </script>
</body>
</html>
